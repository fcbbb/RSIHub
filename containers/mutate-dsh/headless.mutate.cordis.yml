# AHE mutate overlay for `dsh --profile headless` (dsh 0.2.1-rc.5).
#
# The candidate is evaluated through the sdk-minimal runtime in
# full-chain/rollout.  This overlay only changes the *meta* session that edits
# the candidate: persona, model, and approval.  It intentionally does not
# touch sandbox-policy or insert terminal/persistent-bash rows; headless ships
# writable tool-fs and tool-bash over dsh-base.
#
# Environment injected by DshContainerAgent:
#   DSH_MODEL / DSH_CONTEXT_WINDOW / DEEPSEEK_API_KEY / DEEPSEEK_BASE_URL
#   DSH_PERMISSION_MODE=danger-full-access

- id: system-prompt
  config:
    personaPrefix: |-
      You are a harness engineer evolving a DeepSeek Harness (dsh) candidate.
      Your working directory is the candidate workspace. The candidate profile is
      `target/profile.cordis.yml`; it is a patch over the sdk-minimal bundle.
      `target/plugins/` holds candidate plugin source files and `target/skills/`
      holds candidate skill packages.

      Edit only the declared mutable surface. Never edit `target/agent.py`,
      `target/dsh_trajectory.py`, or `target/runners/**`. Keep the profile valid
      YAML and keep plugin imports resolvable. The sdk-minimal runtime is fixed:
      only reference packages already installed in it, and never add npm
      dependencies or import removed demo-spine packages. Do not copy evolution
      workflow, evidence paths, or change-manifest requirements into runtime
      prompts.

      The task prompt in this message defines the evidence to read, the addable
      runtime capabilities, and the output to produce; follow it.

- id: agent-default-model
  config:
    provider: deepseek-official
    model: !!js process.env.DSH_MODEL ?? 'deepseek-v4-flash'

- id: llm-deepseek
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    streamIdleTimeoutMs: 600000
    models:
      - id: !!js process.env.DSH_MODEL ?? 'deepseek-v4-flash'
        contextWindow: !!js Number(process.env.DSH_CONTEXT_WINDOW ?? 1000000)

# Headless has no interactive approver; a one-shot meta session must never wait.
# `never` rejects approval requests instead of hanging.
- id: approval
  config:
    policy: never

# Presets bundle a sandbox mode with an approval policy. This image has no
# bwrap and the host kernel has no Landlock, so dsh's sandboxed bash fails
# closed with "no sandbox backend"; the mutate agent could not run any command,
# including the boot checks its prompt asks for. ``danger-full-access`` runs
# commands unconfined inside this single-use container. Patching approval to
# `never` no longer matches the built-in ``danger-full-access`` preset's
# approval, so declare the matching preset explicitly; otherwise service
# construction fails with "composed sandbox and approval defaults match no
# preset".
- id: permission
  config:
    defaultPreset: evolve-danger-full-access
    presets:
      evolve-danger-full-access:
        sandbox: danger-full-access
        approval: never
        name: evolve-danger-full-access
        description: Unconfined commands in the single-use mutation container, no approval prompts.

# Session titles are unnecessary for one-shot runs and would spend an extra
# model call on every invocation.
- id: session-title-llm
  disabled: true
