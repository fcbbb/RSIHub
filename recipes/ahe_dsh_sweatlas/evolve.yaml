experiment:
  id: ahe_dsh_sweatlas
  max_generations: 5
  target_score: null
  children_per_gen: 1
  mode: driver
  seed: 0

target:
  seed: builtin-dsh-harbor

surface:
  # Keep the surface wide and freeze the Harbor seams by exclude, like
  # hyperagents_dsh. The mutate control file lives at
  # target/.ahe-change-manifest.json and must pass the install gate; the
  # candidate runtime is staged by CANDIDATE_RUNTIME_ENTRIES regardless.
  include:
    - target/**
  exclude:
    - target/agent.py
    - target/dsh_trajectory.py
    - target/runners/**

operators:
  select:
    operator: ahe_latest
    timeout_s: 600
    config: {}
  rollout:
    operator: parent_evaluation
    timeout_s: 600
    config: {field_limit: 2000}
  analyze:
    operator: ahe
    # 30 tasks / 10 workers, one serial task, up to 3 debugger attempts at
    # 900 s each: ~10,800 s worst case. Keep the stage above that.
    timeout_s: 12000
    config:
      max_tasks: 30
      max_concurrent: 10
      timeout_per_task: 900
      debugger_max_retries: 2
      field_limit: 2000
      # SWE-Atlas TW rewards are binary: every rubric, manifest and mutation
      # gate must pass.
      pass_threshold: 1.0
      debugger:
        runner: harbor
        agent: evolve.integrations.harbor.dsh_container:DshContainerAgent
        model: openai/deepseek-v4.1-flash-1017
        environment: docker
        image: evolve-mutate-dsh:20261104-dsh021rc5
        agent_kwargs: {role: analyst, version: 0.2.1-rc.5}
        agent_env: {DSH_CONTEXT_WINDOW: "1000000"}
  mutate:
    operator: ahe
    timeout_s: 3600
    config:
      runner: harbor
      expose_gate_data: false
      agent: evolve.integrations.harbor.dsh_container:DshContainerAgent
      model: openai/deepseek-v4.1-flash-1017
      environment: docker
      image: evolve-mutate-dsh:20261104-dsh021rc5
      editable_roots: [target]
      prompt_path: target/profile.cordis.yml
      agent_kwargs: {role: mutate, version: 0.2.1-rc.5}
      agent_env: {DSH_CONTEXT_WINDOW: "1000000"}
      max_retries: 1
  validate:
    operator: node_check
    timeout_s: 300
    config: {}
  gate:
    operator: ahe_artifact_valid
    timeout_s: 600
    config: {}
  record:
    operator: jsonl
    timeout_s: 600
    config: {}
  timeout_s: 600

evaluator:
  engine: harbor
  model: openai/deepseek-v4.1-flash-1017
  dataset: /home/fcbbb/RSI/benchmark/SWE-Atlas/data/tw
  agent: target.agent:DshAgent
  evaluation_split: train
  split: {train: 0.7, gate: 0.0, sealed: 0.3, seed: 0}
  sampling: static
  tasks_per_round: 63
  repetitions: 1
  n_concurrent: 16
  # The held-out 30% is evaluated once for gen/0 and once for the best
  # train-split candidate after the last generation.
  anchor: {final: true, every_rounds: 0}
  max_retries: 1
  benchmark_timeout_is_zero: true
  # Tolerate sparse infrastructure failures (for example a task verifier
  # exceeding its own 600 s cap) instead of voiding the whole round. Missing
  # trials are scored as zero because classify_evaluation divides by
  # tasks_per_round, so partial coverage can only understate a candidate.
  # ReviewBench is the exception: its macro-F1 identity needs every trial, so
  # reward_schema=reviewbench still requires partial_floor: 1.0 (enforced in
  # evolve.workspace).
  partial_floor: 0.8
  # The verifier runs mutation testing plus one LLM call per rubric and one
  # manifest check; task.toml budgets 900 s, which is tight for 13 calls.
  verifier_timeout_multiplier: 3
  # The dataset deliberately carries no deployment endpoint. The model host is
  # merged into the agent-phase allowlist at run time, exactly as
  # `harbor run --allow-agent-host` does for the upstream pass_k.sh.
  agent_allowed_hosts:
    - token-plan.cn-beijing.maas.aliyuncs.com
  agent_env:
    DSH_TASK_TIMEOUT_SEC: "10800"
    DSH_RUNTIME_IMAGE: evolve-mutate-dsh:20261104-dsh021rc5