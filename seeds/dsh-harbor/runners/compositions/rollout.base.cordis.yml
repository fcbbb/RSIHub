# Frozen candidate runtime overlay — applied as a `--patch` on top of
# profile sdk-minimal. Candidates cannot edit this file.
#
# The dsh runtime runs INSIDE the Harbor task container (like the installed
# Codex/MiniSWE agents), so sdk-minimal's own local `terminal-bash` plus
# `persistent-bash` rows are the tool execution path. There is deliberately no
# docker-exec shell bridge here: `bash` runs in the container that the model
# is already isolated in.
#
# The session working directory comes from the SDK `initialize` request
# (built from the container's WorkingDir by DshAgent); the model and provider
# are chosen there too, so this patch only pins runtime defaults
# that must not drift with an evolved candidate profile:
#   - sandbox stays danger-full-access: the task container IS the sandbox
#   - the OpenAI-compatible adapter reads credentials from the injected env
#
# Runtime variables (injected by the in-container driver):
#   DSH_MODEL / DSH_CONTEXT_WINDOW / OPENAI_API_KEY / OPENAI_BASE_URL

- id: sandbox-policy
  config:
    mode: danger-full-access
    workspaceRoot: !!js process.cwd()

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    headroomTokens: 16384
    maxTokens: 16384
    thresholdRatio: 0.85
    retainRatio: 0.10

- id: llm-deepseek
  disabled: true

- insert:
    - id: llm-pi-ai
      name: '@deepseek-ai/dsh-llm-pi-ai'
      config:
        providers:
          evolve-openai:
            apiKeyEnv: OPENAI_API_KEY
            api: openai-completions
            baseURL: !!js process.env.OPENAI_BASE_URL
            streamIdleTimeoutMs: 600000
            defaultContextWindow: !!js Number(process.env.DSH_CONTEXT_WINDOW ?? 131072)
            defaultMaxTokens: !!js Number(process.env.DSH_MAX_TOKENS ?? 32768)
            models:
              - id: !!js process.env.DSH_MODEL ?? 'deepseek-v4-flash-0731'
                contextWindow: !!js Number(process.env.DSH_CONTEXT_WINDOW ?? 131072)
                maxTokens: !!js Number(process.env.DSH_MAX_TOKENS ?? 32768)
